name: Deploy Vite React App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write  # allows the self-heal step to push back protected files
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # --no-frozen-lockfile so the build works even if pnpm-lock.yaml
        # was temporarily removed by a Figma Make sync commit
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # ── Self-heal: restore files that Figma Make syncs tend to delete ──────
      # Commits deploy.yml and pnpm-lock.yaml back to main after every
      # successful build. The [skip ci] tag prevents this commit from
      # triggering another workflow run.
      - name: Restore protected files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add .github/workflows/deploy.yml pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Protected files already present — nothing to restore."
          else
            git commit -m "ci: restore protected files [skip ci]"
            git push origin main
            echo "Protected files restored and pushed."
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
